# creating ci pipeline for app.py file and checking lint 
name: autolinter
on: 
 push: 
   paths: "*.py"
jobs:
  code: 
     runs-on: ubuntu_latest
  steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linter
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check .
  
